packages:
  - "apps/*"
  - "packages/cellix/*"
  - "packages/axc/*"
  - "packages/axc-verification/*"

engineStrict: true

# CI installs with a frozen lockfile. Do not let turbo tasks trigger installs.
verifyDepsBeforeRun: false

# Dependency lifecycle scripts stay unapproved. The verify gate rejects any
# allowBuilds entry that is true and any onlyBuiltDependencies approval.
catalog:
  "@apollo/server": 5.5.0
  "@azure/functions": 4.11.0
  "@cucumber/cucumber": 12.8.1
  "@cucumber/messages": 32.3.1
  "@storybook/addon-vitest": 10.4.2
  "@serenity-js/assertions": 3.43.0
  "@serenity-js/console-reporter": 3.43.0
  "@serenity-js/core": 3.43.0
  "@serenity-js/cucumber": 3.43.0
  "@serenity-js/serenity-bdd": 3.43.0
  "@types/node": ^24.10.1
  "@vitest/browser-playwright": 4.1.11
  "@vitest/coverage-istanbul": 4.1.11
  archunit: ^2.1.63
  graphql: ^16.10.0
  mongodb: 6.18.0
  mongodb-memory-server-core: 10.1.4
  mongoose: 8.24.1
  playwright: 1.59.0
  react: ^19.2.7
  react-dom: ^19.2.7
  rimraf: 6.0.1
  tsx: ^4.21.0
  typescript: 6.0.3
  vitest: 4.1.11

allowBuilds:
  '@apollo/protobufjs': false
  core-js: false
  esbuild: false

patchedDependencies:
  "@azure/functions@4.11.0": patches/@azure__functions@4.11.0.patch

overrides:
  axios: 1.20.0
  serialize-javascript: 7.1.1
  deepmerge: 4.1.2
  braces: file:vendor/safe-braces
  uri-js: file:vendor/safe-uri-js
  http-cache-semantics: file:vendor/safe-http-cache-semantics
  "sockjs>uuid": file:vendor/safe-uuid
  "webpack-bundle-analyzer>sirv": 3.0.2
  webpack: 5.104.1
